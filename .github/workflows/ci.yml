name: CI

# Runs on every push to main and on every pull request.
#
# Blocking checks are the ones that pass today: the player site's tests and the type checks of
# the site admin and the owner panel. Lint (all three apps) and the owner panel's tests have
# known failures, so they run and report but do not fail the build (`continue-on-error`); remove
# that line from a step once it is clean.
#
# Not here on purpose: the backend tests (they need PostgreSQL and Redis and a migrated test
# database) and the production builds.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Player site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Asset maps match the asset folders
        run: npm run gen:globs && npm run check:globs
      - name: Tests
        run: npm test
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

  admin:
    name: Site admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check-types
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

  owner-panel:
    name: Owner panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owner-panel/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check-types
      - name: Tests (report only)
        run: npm test
        continue-on-error: true
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true
