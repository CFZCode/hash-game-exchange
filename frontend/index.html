<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#232626" />
    <title>bc-games</title>

    <!--
      The pre-boot loader, verbatim from the original's index.html.

      This has to live here, inline, and not in a component: its whole job is to be on
      screen during the gap between the HTML arriving and the JS bundle parsing, mounting
      and painting. Anything imported from src/ is by definition too late to cover that gap.

      For the same reason the images sit in public/ rather than src/assets — they have to be
      fetchable from a plain url() in this file with no bundler step in between.

      html is painted #232626 immediately so the page never flashes white before the app's
      own background applies.
    -->
    <style>
      html {
        background-color: #232626;
      }

      body {
        background-color: #f4f4f4;
      }

      body.dark {
        background-color: #232626;
      }

      #start-up {
        width: 11rem;
        height: 11rem;
        background-image: url('/init-light.png');
        background-size: contain;
        position: fixed;
        top: 50%;
        z-index: 0;
        animation: init_heartBeat 0.6s infinite linear;
      }

      /* An 11rem box pulled back by half its own size. The original centres it with a
         negative margin rather than a translate because the transform property is already
         spoken for by the heartbeat animation. */
      [dir='ltr'] #start-up {
        left: 50%;
        margin: -5.5rem 0 0 -5.5rem;
      }

      [dir='rtl'] #start-up:not(:where([dir='ltr'], [dir='ltr'] *)) {
        right: 50%;
        margin: -5.5rem -5.5rem 0 0;
      }

      body.dark #start-up {
        background-image: url('/init-dark.png');
      }

      @keyframes init_heartBeat {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <!-- `app-root dark` is the original's body class. This build is dark-only, but the class
       is not decorative: the `body.dark` rules above key off it. -->
  <body class="app-root dark">
    <div id="root"></div>
    <div id="start-up"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
